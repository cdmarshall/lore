<!DOCTYPE html><html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--paper);padding:20px 24px;font-family:var(--font-pixel)}a{color:var(--gold-deep)}a:hover{color:var(--ink)}</style></head><body>
<div id="root"></div>
<script type="text/babel">
const { Button, Badge, Chip, Panel, SectionHead, StatTile, Signet } = window.LoreDesignSystem_00384f;
function Demo(){
  const [lore,setLore]=React.useState(true);
  return <div style={{display:'flex',flexDirection:'column',gap:'18px'}}>
    <div style={{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap'}}>
      <Button>Primary</Button><Button variant="secondary">Secondary</Button><Button variant="gold">Gold</Button><Button variant="arcane">Arcane</Button><Button variant="ghost" size="sm">Ghost sm</Button><Button disabled>Disabled</Button>
    </div>
    <div style={{display:'flex',gap:'10px',alignItems:'center',flexWrap:'wrap'}}>
      <Badge tone="danger">Overdue</Badge><Badge tone="warn">Due soon</Badge><Badge tone="gold">Upcoming</Badge><Badge tone="success">Done</Badge><Badge tone="info">Email</Badge><Badge tone="neutral">TBD</Badge>
      <Chip tone="arcane" on={lore} onClick={()=>setLore(!lore)}>Lore</Chip><Chip tone="success">Spec</Chip>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
      <Panel variant="hero" wash="gold"><SectionHead title="Needs you" count={3} note="Two before noon; the rest can wait."/></Panel>
      <Panel variant="parchment"><div style={{display:'flex',gap:'12px',alignItems:'center'}}><Signet size={40} src="../../assets/scroll.svg" label="Made by Lore"/><div style={{display:'flex',gap:'10px',marginLeft:'auto'}}><StatTile value={10} label="Total"/><StatTile value={2} label="Overdue" tone="danger"/><StatTile value={5} label="Lore" tone="arcane"/></div></div></Panel>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
