<!-- @dsCard group="Colors" viewport="700x110" name="Status" subtitle="Muted heraldic status hues with soft tints" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:18px 22px;font-family:var(--font-pixel)}
.row{display:flex;gap:10px}
.pair{flex:1;border:1px solid var(--rule)}
.pair .top{height:44px;display:flex;align-items:flex-end;padding:6px 8px;box-sizing:border-box}
.pair .top b{font-size:10px;color:#fff;letter-spacing:0.06em}
.pair .bot{height:20px;display:flex;align-items:center;padding:0 8px}
.pair .bot span{font-size:9px}
a{color:var(--gold-deep)}a:hover{color:var(--ink)}</style></head><body>
<div class="row">
<div class="pair"><div class="top" style="background:var(--danger)"><b>--danger</b></div><div class="bot" style="background:var(--danger-soft)"><span style="color:var(--danger)">overdue</span></div></div>
<div class="pair"><div class="top" style="background:var(--warn)"><b>--warn</b></div><div class="bot" style="background:var(--warn-soft)"><span style="color:var(--warn)">due soon</span></div></div>
<div class="pair"><div class="top" style="background:var(--success)"><b>--success</b></div><div class="bot" style="background:var(--success-soft)"><span style="color:var(--success)">done / spec</span></div></div>
<div class="pair"><div class="top" style="background:var(--info)"><b>--info</b></div><div class="bot" style="background:var(--info-soft)"><span style="color:var(--info)">email / links</span></div></div>
</div>
</body></html>
