<!-- @dsCard group="Type" viewport="700x160" name="UI — Jersey 15" subtitle="Chrome: labels, chips, buttons, counts, nav — keep ≥13px" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:20px 22px;color:var(--ink);font-family:var(--font-pixel)}
.big{font-size:26px}
.nums{font-size:20px;color:var(--ink-soft);margin-top:6px}
.lab{font-size:13px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-faint);margin-top:10px}
.chips{display:flex;gap:8px;margin-top:12px;font-size:14px;letter-spacing:0.08em;text-transform:uppercase}
.chips span{padding:2px 8px;border:1px solid currentColor}
a{color:var(--gold-deep)}a:hover{color:var(--ink)}</style></head><body>
<div class="big">Needs you · Worth knowing · Knowledge base</div>
<div class="nums">0123456789 · 5d overdue · Apr 25, 2026</div>
<div class="lab">--font-pixel · Jersey 15 · never body copy</div>
<div class="chips"><span style="color:var(--gold-deep);background:var(--gold-soft)">Upcoming</span><span style="color:var(--danger);background:var(--danger-soft)">Overdue</span><span style="color:var(--arcane);background:var(--arcane-soft)">Lore</span><span style="color:var(--success);background:var(--success-soft)">Spec</span></div>
</body></html>
