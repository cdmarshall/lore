<!-- @dsCard group="Brand" viewport="700x190" name="Dither Textures" subtitle="Ordered Bayer tiles replace every gradient and blur" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:18px 22px;font-family:var(--font-pixel);color:var(--ink)}
.row{display:flex;gap:10px;margin-bottom:10px}
.t{flex:1;height:56px;border:1px solid var(--rule);image-rendering:pixelated;background-size:16px 16px;position:relative}
.t i{position:absolute;left:6px;bottom:4px;font-style:normal;font-size:9px;color:var(--ink-faint);background:var(--paper);padding:0 3px}
.w{flex:1;height:56px;border:1px solid var(--rule);image-rendering:pixelated;background-size:16px 192px;background-position:bottom left;background-repeat:repeat-x;position:relative}
a{color:var(--gold-deep)}a:hover{color:var(--ink)}</style></head><body>
<div class="row">
<div class="t" style="background-image:var(--dither-ink-06)"><i>ink-06</i></div>
<div class="t" style="background-image:var(--dither-ink-12)"><i>ink-12</i></div>
<div class="t" style="background-image:var(--dither-ink-25)"><i>ink-25</i></div>
<div class="t" style="background-image:var(--dither-ink-50)"><i>ink-50</i></div>
<div class="t" style="background-image:var(--dither-gold-25)"><i>gold-25</i></div>
<div class="t" style="background-image:var(--dither-arcane-25)"><i>arcane-25</i></div>
</div>
<div class="row" style="margin-bottom:0">
<div class="w" style="background-image:var(--dither-wash-ink)"><i style="position:absolute;left:6px;top:4px;font-style:normal;font-size:9px;color:var(--ink-faint)">wash-ink</i></div>
<div class="w" style="background-image:var(--dither-wash-gold)"><i style="position:absolute;left:6px;top:4px;font-style:normal;font-size:9px;color:var(--ink-faint)">wash-gold</i></div>
<div class="w" style="background-image:var(--dither-wash-arcane)"><i style="position:absolute;left:6px;top:4px;font-style:normal;font-size:9px;color:var(--ink-faint)">wash-arcane</i></div>
</div>
</body></html>
