<!-- @dsCard group="Spacing" viewport="700x150" name="Pixel Grid" subtitle="4px base grid; 720px reading column" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:20px 22px;font-family:var(--font-pixel);color:var(--ink)}
.r{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.r b{width:90px;font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:0.06em}
.bar{height:12px;background:var(--gold)}
a{color:var(--gold-deep)}a:hover{color:var(--ink)}</style></head><body>
<div class="r"><b>--space-1</b><div class="bar" style="width:4px"></div></div>
<div class="r"><b>--space-2</b><div class="bar" style="width:8px"></div></div>
<div class="r"><b>--space-4</b><div class="bar" style="width:16px"></div></div>
<div class="r"><b>--space-6</b><div class="bar" style="width:24px"></div></div>
<div class="r"><b>--space-8</b><div class="bar" style="width:32px"></div></div>
<div class="r"><b>--space-12</b><div class="bar" style="width:48px"></div></div>
</body></html>
