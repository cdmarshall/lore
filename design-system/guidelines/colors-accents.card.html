<!-- @dsCard group="Colors" viewport="700x170" name="Gold & Arcane" subtitle="The signet metal and the reserved magic accent" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:18px 22px;font-family:var(--font-pixel)}
.row{display:flex;gap:10px}
.sw{flex:1;height:64px;border:1px solid var(--rule);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;box-sizing:border-box}
.sw b{font-size:10px;font-weight:600;letter-spacing:0.06em}.sw span{font-size:9px;opacity:0.7}
.dark b,.dark span{color:#fff}
a{color:var(--gold-deep)}a:hover{color:var(--ink)}</style></head><body>
<div class="row" style="margin-bottom:10px">
<div class="sw dark" style="background:var(--gold-deep)"><b>--gold-deep</b><span>#856a22</span></div>
<div class="sw dark" style="background:var(--gold)"><b>--gold</b><span>#a9862f</span></div>
<div class="sw" style="background:var(--gold-bright)"><b>--gold-bright</b><span>#d4b158</span></div>
<div class="sw" style="background:var(--gold-soft)"><b>--gold-soft</b><span>#f4edd8</span></div>
</div>
<div class="row">
<div class="sw dark" style="background:var(--arcane)"><b>--arcane</b><span>#6b4f8e</span></div>
<div class="sw dark" style="background:var(--arcane-bright)"><b>--arcane-bright</b><span>#7f63b8</span></div>
<div class="sw" style="background:var(--arcane-glow)"><b>--arcane-glow</b><span>#c9b8ea</span></div>
<div class="sw" style="background:var(--arcane-soft)"><b>--arcane-soft</b><span>#efe7f4</span></div>
</div>
</body></html>
