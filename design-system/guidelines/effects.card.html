<!-- @dsCard group="Spacing" viewport="700x170" name="Borders & Shadows" subtitle="Radius 0; hard pixel offsets, no blur ever" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:22px;display:flex;gap:20px;align-items:flex-start;font-family:var(--font-pixel);color:var(--ink)}
.b{background:#fff;width:140px;height:90px;box-sizing:border-box;padding:10px;font-size:10px;color:var(--ink-faint);letter-spacing:0.06em}
a{color:var(--gold-deep)}a:hover{color:var(--ink)}</style></head><body>
<div class="b" style="border:var(--border-thin);box-shadow:var(--shadow-sprite)">card<br>1px rule +<br>--shadow-sprite</div>
<div class="b" style="border:var(--border-px);box-shadow:var(--shadow-sprite)">hero<br>2px ink +<br>--shadow-sprite</div>
<div class="b" style="border:2px solid var(--parchment-shade);background:var(--parchment);box-shadow:var(--shadow-sprite)">parchment<br>panel</div>
<div class="b" style="border:var(--border-px);box-shadow:var(--shadow-press);transform:translate(2px,2px)">pressed<br>translate(2,2) +<br>--shadow-press</div>
<div class="b" style="border:2px solid var(--arcane);box-shadow:var(--shadow-arcane);color:var(--arcane)">arcane<br>--shadow-arcane</div>
</body></html>
