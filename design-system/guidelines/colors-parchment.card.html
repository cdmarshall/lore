<!-- @dsCard group="Colors" viewport="700x170" name="Parchment & Ink" subtitle="Paper surfaces and warm ink text scale" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--paper);padding:18px 22px;font-family:var(--font-pixel)}
.row{display:flex;gap:10px}
.sw{flex:1;height:64px;border:1px solid var(--rule);display:flex;flex-direction:column;justify-content:flex-end;padding:6px 8px;box-sizing:border-box}
.sw b{font-size:10px;font-weight:600;letter-spacing:0.06em}.sw span{font-size:9px;color:inherit;opacity:0.7}
.dark b,.dark span{color:#fff}
a{color:var(--gold-deep)}a:hover{color:var(--ink)}</style></head><body>
<div class="row" style="margin-bottom:10px">
<div class="sw" style="background:var(--paper)"><b>--paper</b><span>#faf9f6</span></div>
<div class="sw" style="background:var(--paper-band)"><b>--paper-band</b><span>#f3f0e8</span></div>
<div class="sw" style="background:var(--parchment)"><b>--parchment</b><span>#f6efdc</span></div>
<div class="sw" style="background:var(--parchment-shade)"><b>--parchment-shade</b><span>#dfcb99</span></div>
<div class="sw" style="background:var(--rule)"><b>--rule</b><span>#e3ddce</span></div>
</div>
<div class="row">
<div class="sw dark" style="background:var(--ink)"><b>--ink</b><span>#26221c</span></div>
<div class="sw dark" style="background:var(--ink-soft)"><b>--ink-soft</b><span>#514a3e</span></div>
<div class="sw dark" style="background:var(--ink-faint)"><b>--ink-faint</b><span>#8c8577</span></div>
</div>
</body></html>
